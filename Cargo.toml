[package]
name = "jay-tray-item"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"

[[bin]]
name = "jay-tray-item"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
wl-client = "0.2"
memfile = "0.3"
image = { version = "0.25", default-features = false, features = ["png"] }
resvg = { version = "0.49", default-features = false, features = ["raster-images"] }

[build-dependencies]
wl-client-builder = "0.2"
